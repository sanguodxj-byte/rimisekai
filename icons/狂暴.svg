    <!-- 狂暴（增益）：一张**暴怒的脸嵌在三舌火苗里**。
         上一版火苗外廓是个光滑的圆团（没有火舌），实机 40px 下被判成「带脸的水滴史莱姆」。
         现在外廓换成和 40 灼烧同源的**三舌火苗**（高主火舌 + 两条矮侧火舌），
         轮廓先读成「火」，再看脸才是「狂暴」。 -->
