<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <rect width="512" height="512" fill="#000000"/>
  <g transform="translate(244, 256) rotate(-22)">
    <!-- 上环圈（饱满圆润） -->
    <ellipse cx="0" cy="-75" rx="120" ry="90" fill="#E9EFEA"/>
    <ellipse cx="0" cy="-75" rx="65" ry="44" fill="#000000"/>
    <!-- 下环圈（饱满圆润） -->
    <ellipse cx="0" cy="75" rx="120" ry="90" fill="#E9EFEA"/>
    <ellipse cx="0" cy="75" rx="65" ry="44" fill="#000000"/>
