<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <rect width="512" height="512" fill="#000000"/>
  <g transform="translate(256, 246)">
    <!-- 巨大饱满的下垂实心毒液水滴（Poison Drop） -->
    <path fill="#E9EFEA" d="
      M 0,-190
      C 45,-120 150,-10 150,75
      C 150,155 85,210 0,210
      C -85,210 -150,155 -150,75
      C -150,-10 -45,-120 0,-190
      Z
    "/>
    <!-- 毒液滴内部嵌有标志性的剧毒骷髅头（Skull Poison icon，负形挖空） -->
    <!-- 骷髅脑壳 -->
    <circle cx="0" cy="50" r="60" fill="#000000"/>
    <!-- 下颌骨 -->
    <rect x="-35" y="85" width="70" height="35" rx="6" fill="#000000"/>
    <!-- 双眼窝 -->
    <circle cx="-25" cy="45" r="15" fill="#E9EFEA"/>
    <circle cx="25" cy="45" r="15" fill="#E9EFEA"/>
    <!-- 倒三角鼻孔 -->
    <polygon fill="#E9EFEA" points="0,65 8,78 -8,78"/>
    <!-- 牙齿纵缝 -->
    <polygon fill="#E9EFEA" points="-12,90 -6,90 -6,115 -12,115"/>
    <polygon fill="#E9EFEA" points="6,90 12,90 12,115 6,115"/>
  </g>
</svg>