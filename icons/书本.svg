<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <rect width="512" height="512" fill="#000000"/>
  <g transform="translate(256, 221)">
    <!-- 翻开的书本左右双翼大波浪书页 -->
    <path fill="#E9EFEA" d="
      M 0,-120
      C -60,-155 -160,-140 -210,-115
      C -220,-110 -225,-95 -220,-85
      L -195,145
      C -150,115 -60,110 0,145
      C 60,110 150,115 195,145
      L 220,-85
      C 225,-95 220,-110 210,-115
      C -160,-140 60,-155 0,-120
      Z
    "/>
    <!-- 中央装订书脊深缝（负形尖角沟） -->
    <polygon fill="#000000" points="-10,-125 10,-125 6,155 -6,155"/>
    <!-- 左右内页厚度层叠线（负形凹槽） -->
    <path fill="#000000" d="M -180,-75 C -130,-100 -50,-90 -12,-70 L -12,-55 C -50,-75 -130,-85 -180,-60 Z"/>
    <path fill="#000000" d="M 180,-75 C 130,-100 50,-90 12,-70 L 12,-55 C 50,-75 130,-85 180,-60 Z"/>
    <!-- 中央垂下的丝绸书签缎带（Bookmark Ribbon） -->
    <path fill="#E9EFEA" d="M -12,145 L 12,145 L 20,210 L 0,190 L -20,210 Z"/>
  </g>
</svg>