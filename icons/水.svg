<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <rect width="512" height="512" fill="#000000"/>
  <g transform="translate(256, 253)">
    <!-- 饱满灵动的大水滴与荡漾水圈波纹（Water Drop） -->
    <!-- 主水滴 -->
    <path fill="#E9EFEA" d="
      M 0,-190
      C 30,-125 125,-10 125,65
      C 125,140 68,195 0,195
      C -68,195 -125,140 -125,65
      C -125,-10 -30,-125 0,-190
      Z
    "/>
    <!-- 水滴内部反光月牙（负形挖空） -->
    <path fill="#000000" d="
      M -35,-85
      C -15,-30 -15,40 -40,95
      C -65,115 -85,100 -95,75
      C -98,40 -85,-10 -65,-55
      Z
    "/>
    <circle cx="-35" cy="-75" r="12" fill="#E9EFEA"/>
  </g>
</svg>