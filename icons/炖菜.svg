<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <rect width="512" height="512" fill="#000000"/>
  <g transform="translate(256, 263)">
    <!-- 双耳铸铁热锅（Cauldron / Stew Pot） -->
    <path fill="#E9EFEA" d="
      M -140,-20
      L 140,-20
      C 165,65 145,155 0,165
      C -145,155 -165,65 -140,-20
      Z
    "/>
    <!-- 锅口翻边折沿 -->
    <ellipse cx="0" cy="-20" rx="150" ry="24" fill="#E9EFEA"/>
    <ellipse cx="0" cy="-20" rx="130" ry="16" fill="#000000"/>
    <!-- 锅内热气翻滚的浓汤食材高光 -->
    <ellipse cx="0" cy="-18" rx="110" ry="10" fill="#E9EFEA"/>

    <!-- 锅两侧铸造实心大耳把手 -->
    <path fill="#E9EFEA" d="M -140,-15 C -195,-15 -195,45 -145,45 L -140,25 C -170,25 -170,5 -140,5 Z"/>
    <path fill="#E9EFEA" d="M 140,-15 C 195,-15 195,45 145,45 L 140,25 C 170,25 170,5 140,5 Z"/>

    <!-- 锅顶升腾的实心热气蒸云 -->
    <path fill="#E9EFEA" d="M -70,-60 C -60,-90 -90,-110 -65,-150 C -45,-120 -75,-90 -60,-60 Z"/>
    <path fill="#E9EFEA" d="M 0,-70 C 15,-110 -20,-130 0,-180 C 20,-140 -10,-110 5,-70 Z"/>
    <path fill="#E9EFEA" d="M 70,-60 C 60,-90 90,-110 65,-150 C 45,-120 75,-90 60,-60 Z"/>
  </g>
</svg>