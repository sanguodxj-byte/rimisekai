<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <rect width="512" height="512" fill="#000000"/>
  <g transform="translate(236, 202) rotate(-26)">
    <!-- 铸锭顶部水平平坦切面（大高光顶面） -->
    <path fill="#E9EFEA" d="
      M -200,-30
      L 140,-30
      L 210,50
      L -130,50
      Z
    "/>
    <!-- 顶面与正面之间的黑色倒角分界带 -->
    <rect x="-195" y="-30" width="335" height="18" fill="#000000"/>
    <!-- 铸锭正面宽大斜向受光大块面（厚度达 120px） -->
    <path fill="#E9EFEA" d="
      M -200,-10
      L -130,50
      L -130,150
      L -200,90
      Z
    "/>
    <path fill="#E9EFEA" d="
      M -200,90
      L -130,150
      L 140,150
      L 140,90
      Z
    "/>
    <!-- 正面中央金属锻造凹槽（短而宽，非贯穿） -->
    <rect x="-80" y="85" width="160" height="34" rx="8" fill="#000000"/>
    <rect x="-65" y="93" width="130" height="18" rx="4" fill="#E9EFEA"/>
    <!-- 侧面深色梯形厚度阴影切面 -->
    <polygon fill="#000000" points="140,-30 210,50 210,130 140,50"/>
    <polygon fill="#E9EFEA" points="140,50 200,100 200,120 140,70"/>
  </g>
</svg>
