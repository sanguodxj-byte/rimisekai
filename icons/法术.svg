<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <rect width="512" height="512" fill="#000000"/>
  <g transform="translate(256, 256)">
    <!-- 神秘正统的六芒星奥术魔法阵（Magic Rune Circle） -->
    <!-- 外能量环 -->
    <circle cx="0" cy="0" r="185" fill="#E9EFEA"/>
    <circle cx="0" cy="0" r="170" fill="#000000"/>
    <circle cx="0" cy="0" r="162" fill="#E9EFEA"/>
    <circle cx="0" cy="0" r="150" fill="#000000"/>

    <!-- 正三角形 1 -->
    <polygon fill="#E9EFEA" points="0,-140 121,70 -121,70"/>
    <polygon fill="#000000" points="0,-115 100,58 -100,58"/>
    <!-- 倒三角形 2 -->
    <polygon fill="#E9EFEA" points="0,140 121,-70 -121,-70"/>
    <polygon fill="#000000" points="0,115 100,-58 -100,-58"/>

    <!-- 法阵中央悬浮的纯实心奥术宝珠与四方星芒 -->
    <circle cx="0" cy="0" r="38" fill="#E9EFEA"/>
    <polygon fill="#000000" points="0,-22 6,-6 22,0 6,6 0,22 -6,6 -22,0 -6,-6"/>
  </g>
</svg>