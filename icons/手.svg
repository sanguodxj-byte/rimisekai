<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <rect width="512" height="512" fill="#000000"/>
  <g transform="translate(268, 258)">
    <!-- 骑士板甲铁手套（Gauntlet） -->
    <path fill="#E9EFEA" d="M -85,190 L 85,190 L 65,80 L -65,80 Z"/>
    <polygon fill="#E9EFEA" points="-75,75 75,75 60,35 -60,35"/>
    <polygon fill="#E9EFEA" points="-68,30 68,30 55,-40 -55,-40"/>
    <!-- 指节连击凸棱 -->
    <rect x="-60" y="-55" width="120" height="20" rx="6" fill="#E9EFEA"/>
    <!-- 4根分立弯曲铁指套 -->
    <rect x="-56" y="-170" width="22" height="105" rx="10" fill="#E9EFEA"/>
    <rect x="-28" y="-195" width="22" height="130" rx="10" fill="#E9EFEA"/>
    <rect x="2" y="-190" width="22" height="125" rx="10" fill="#E9EFEA"/>
    <rect x="32" y="-160" width="22" height="95" rx="10" fill="#E9EFEA"/>
    <!-- 外展拇指套 -->
    <path fill="#E9EFEA" d="M -65,-10 C -95,-15 -115,-40 -110,-70 C -105,-85 -90,-80 -75,-60 L -60,-35 Z"/>
  </g>
</svg>
