<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <rect width="512" height="512" fill="#000000"/>
  <g transform="translate(256, 236)">
    <!-- 正面威严耸立的骑士中世纪鸢盾（Kite Shield with Cross） -->
    <!-- 盾面外廓（上平微弧、下收尖锐尖底） -->
    <path fill="#E9EFEA" d="
      M -155,-175 L 155,-175
      C 165,-20 125,100 0,215
      C -125,100 -165,-20 -155,-175
      Z
    "/>
    <!-- 盾牌外围包铁钢边（负形割槽） -->
    <path fill="#000000" d="
      M -135,-155 L 135,-155
      C 145,-15 110,85 0,185
      C -110,85 -145,-15 -135,-155
      Z
    "/>
    <path fill="#E9EFEA" d="
      M -120,-140 L 120,-140
      C 130,-10 95,75 0,165
      C -95,75 -130,-10 -120,-140
      Z
    "/>

    <!-- 盾面正中央大实心十字军骑士十字纹章（Crusader Cross，负形） -->
    <polygon fill="#000000" points="-85,-55 85,-55 85,-25 -85,-25"/>
    <polygon fill="#000000" points="-20,-120 20,-120 20,80 -20,80"/>
  </g>
</svg>