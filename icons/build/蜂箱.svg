<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <rect width="512" height="512" fill="#000000"/>
  <g transform="translate(256, 256)">
    <!-- 草编圆顶蜂巢：层层叠环（负形缝） -->
    <path fill="#E9EFEA" d="M -170,170 C -190,40 -150,-130 0,-150 C 150,-130 190,40 170,170 Z"/>
    <rect x="-200" y="-75" width="400" height="12" fill="#000000"/>
    <rect x="-200" y="0" width="400" height="12" fill="#000000"/>
    <rect x="-200" y="80" width="400" height="12" fill="#000000"/>
    <!-- 巢门 -->
    <path fill="#000000" d="M -40,170 L -40,140 C -40,115 40,115 40,140 L 40,170 Z"/>
    <!-- 底座 -->
    <rect x="-200" y="170" width="400" height="30" rx="6" fill="#E9EFEA"/>
    <!-- 一只蜂 -->
    <ellipse cx="150" cy="-190" rx="34" ry="22" fill="#E9EFEA"/>
    <ellipse cx="135" cy="-220" rx="20" ry="13" fill="#E9EFEA"/>
    <ellipse cx="170" cy="-220" rx="20" ry="13" fill="#E9EFEA"/>
    <rect x="145" y="-210" width="8" height="40" fill="#000000"/>
  </g>
</svg>
