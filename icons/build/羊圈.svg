<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <rect width="512" height="512" fill="#000000"/>
  <g transform="translate(256, 256)">
    <!-- 栅栏 -->
    <rect x="-240" y="110" width="480" height="24" fill="#E9EFEA"/>
    <rect x="-240" y="165" width="480" height="24" fill="#E9EFEA"/>
    <rect x="-220" y="80" width="30" height="130" fill="#E9EFEA"/>
    <rect x="190" y="80" width="30" height="130" fill="#E9EFEA"/>

    <!-- 羊：卷毛头顶、两侧平伸的耳、长脸（与猪圈、牛栏同框同位） -->
    <g transform="translate(0,-62) scale(1.12)">
      <ellipse cx="-115" cy="-25" rx="58" ry="24" transform="rotate(18 -115 -25)" fill="#E9EFEA"/>
      <ellipse cx="115" cy="-25" rx="58" ry="24" transform="rotate(-18 115 -25)" fill="#E9EFEA"/>
      <path fill="#E9EFEA" d="M -70,-60 C -75,-10 -70,40 -55,80 C -40,125 40,125 55,80 C 70,40 75,-10 70,-60 Z" stroke="#000000" stroke-width="14"/>
      <!-- 卷毛：先描一圈黑边，再整片填白，连成一团 -->
      <g fill="#000000" stroke="#000000" stroke-width="24"><circle cx="-70" cy="-75" r="45"/><circle cx="70" cy="-75" r="45"/><circle cx="-30" cy="-110" r="48"/><circle cx="30" cy="-110" r="48"/><circle cx="0" cy="-70" r="50"/></g>
      <g fill="#E9EFEA"><circle cx="-70" cy="-75" r="45"/><circle cx="70" cy="-75" r="45"/><circle cx="-30" cy="-110" r="48"/><circle cx="30" cy="-110" r="48"/><circle cx="0" cy="-70" r="50"/></g>
      <circle cx="-34" cy="-5" r="13" fill="#000000"/><circle cx="34" cy="-5" r="13" fill="#000000"/>
      <ellipse cx="-20" cy="85" rx="10" ry="7" fill="#000000"/><ellipse cx="20" cy="85" rx="10" ry="7" fill="#000000"/>
    </g>
  </g>
</svg>
