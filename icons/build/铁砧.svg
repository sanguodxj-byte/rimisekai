<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <rect width="512" height="512" fill="#000000"/>
  <g transform="translate(256, 256)">
    <!-- 悬着的锻锤 -->
    <g transform="translate(70,-150) rotate(-30)">
      <rect x="-70" y="-30" width="140" height="60" rx="8" fill="#E9EFEA"/>
      <rect x="-12" y="30" width="24" height="120" fill="#E9EFEA"/>
    </g>
    <!-- 砧面：左端尖角，右端方踵 -->
    <path fill="#E9EFEA" d="M -235,-20 C -170,-30 -130,-40 -110,-40 L 190,-40 L 190,30 L 110,30 C 90,30 70,45 60,70 L -60,70 C -70,45 -90,30 -110,30 C -150,30 -200,10 -235,-20 Z"/>
    <!-- 砧腰与底座 -->
    <rect x="-60" y="70" width="120" height="60" fill="#E9EFEA"/>
    <path fill="#E9EFEA" d="M -110,130 L 110,130 L 150,200 L -150,200 Z"/>
    <!-- 砧面方孔（负形） -->
    <rect x="130" y="-28" width="24" height="24" fill="#000000"/>
  </g>
</svg>
