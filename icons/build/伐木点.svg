      <rect x="-12" y="-170" width="24" height="200" rx="8" fill="#E9EFEA"/>
      <path fill="#E9EFEA" d="M 12,-170 L 100,-200 C 120,-150 120,-110 100,-80 L 12,-110 Z"/>
