<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <rect width="512" height="512" fill="#000000"/>
  <g transform="translate(256, 256)">
    <!-- 床头板：高拱顶，带圆头立柱 -->
    <path fill="#E9EFEA" d="M -215,-150 L -170,-150 L -170,-120 C -150,-150 -110,-160 -80,-150 L -80,70 L -215,70 Z"/>
    <circle cx="-192" cy="-165" r="22" fill="#E9EFEA"/>
    <!-- 床尾板 -->
    <path fill="#E9EFEA" d="M 175,-40 L 215,-40 L 215,150 L 190,150 L 190,110 L 175,110 Z"/>
    <circle cx="195" cy="-55" r="18" fill="#E9EFEA"/>
    <!-- 床垫与被褥 -->
    <rect x="-90" y="-20" width="270" height="90" rx="14" fill="#E9EFEA"/>
    <!-- 枕头 -->
    <path fill="#E9EFEA" d="M -70,-30 C -70,-80 10,-80 10,-30 Z"/>
    <!-- 被褥翻边（负形） -->
    <rect x="30" y="-5" width="14" height="75" fill="#000000"/>
    <!-- 床架横梁与床腿 -->
    <rect x="-215" y="80" width="430" height="32" fill="#E9EFEA"/>
    <rect x="-215" y="110" width="30" height="45" fill="#E9EFEA"/>
  </g>
</svg>
