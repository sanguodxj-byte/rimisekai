    <path fill="#E9EFEA" d="M 0,40 C 30,80 60,100 55,140 C 52,170 30,185 0,185 C -30,185 -52,170 -55,140 C -58,110 -30,100 -25,70 C -15,85 -10,90 -5,95 C 0,75 -8,60 0,40 Z"/>
