<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <rect width="512" height="512" fill="#000000"/>
  <g transform="translate(256, 256)">
    <path fill="#E9EFEA" d="M -250,-120 L -170,-190 L -110,-140 L -20,-230 L 80,-150 L 150,-200 L 250,-120 L 250,-105 L -250,-105 Z"/>
    <rect x="-250" y="195" width="500" height="20" fill="#E9EFEA"/>
    <g transform="translate(-80,0) scale(0.65) translate(0,0)">
    <!-- 小屋顶 -->
    <path fill="#E9EFEA" d="M -200,-60 L 0,-200 L 200,-60 L 170,-40 L 0,-160 L -170,-40 Z"/>
    <!-- 舍身（高脚） -->
    <path fill="#E9EFEA" d="M -150,-50 L 0,-150 L 150,-50 L 150,80 L -150,80 Z"/>
    <!-- 圆形窝门（负形）与门里一枚蛋 -->
    <circle cx="0" cy="-10" r="60" fill="#000000"/>
    <ellipse cx="0" cy="10" rx="28" ry="36" fill="#E9EFEA"/>
    <!-- 脚柱与斜梯 -->
    <rect x="-140" y="80" width="28" height="120" fill="#E9EFEA"/>
    <rect x="112" y="80" width="28" height="120" fill="#E9EFEA"/>
    <path fill="#E9EFEA" d="M 140,70 L 165,80 L 240,200 L 210,205 Z"/>
</g><g transform="translate(140,110) scale(0.3) translate(-256,-256)">
  <g transform="translate(248, 250) rotate(-10)">
    <!-- 洁白圆润的完整蛋壳与巢窝（Egg） -->
    <path fill="#E9EFEA" d="
      M 0,-180
      C 85,-180 150,-50 150,55
      C 150,140 85,190 0,190
      C -85,190 -150,140 -150,55
      C -150,-50 -85,-180 0,-180
      Z
    "/>
    <!-- 蛋壳侧面实心反光斑（负形点缀出圆润弧度） -->
    <ellipse cx="-55" cy="-20" rx="25" ry="50" fill="#000000" transform="rotate(-25 -55 -20)"/>
    <ellipse cx="-52" cy="-20" rx="16" ry="40" fill="#E9EFEA" transform="rotate(-25 -52 -20)"/>
  </g>
</g>
  </g>
</svg>
