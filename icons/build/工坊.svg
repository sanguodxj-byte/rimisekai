<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <rect width="512" height="512" fill="#000000"/>
  <g transform="translate(256, 256)">
    <!-- 山墙屋顶 -->
    <path fill="#E9EFEA" d="M -240,-60 L 0,-220 L 240,-60 L 205,-35 L 0,-170 L -205,-35 Z"/>
    <!-- 屋身 -->
    <path fill="#E9EFEA" d="M -180,-45 L 0,-160 L 180,-45 L 180,200 L -180,200 Z"/>
    <!-- 拱门（负形） -->
    <path fill="#000000" d="M -60,200 L -60,80 C -60,45 -30,25 0,25 C 30,25 60,45 60,80 L 60,200 Z"/>
    <!-- 山墙上交叉锤凿（负形） -->
    <g transform="translate(0,-55)">
      <g transform="rotate(40)"><rect x="-8" y="-55" width="16" height="110" fill="#000000"/><rect x="-28" y="-60" width="56" height="26" fill="#000000"/></g>
      <g transform="rotate(-40)"><rect x="-8" y="-55" width="16" height="110" fill="#000000"/><path fill="#000000" d="M -12,-60 L 12,-60 L 0,-85 Z"/></g>
    </g>
  </g>
</svg>
