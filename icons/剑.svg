<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <rect width="512" height="512" fill="#000000"/>
  <g transform="translate(256, 256) rotate(45)">
    <!-- 剑身：雄浑挺拔的实心双刃（加宽加厚，饱满无锯齿） -->
    <path fill="#E9EFEA" d="
      M 0,-238
      L 34,-180
      L 30,-30
      L 26,45
      L 18,88
      L -18,88
      L -26,45
      L -30,-30
      L -34,-180
      Z
    "/>

    <!-- 十字护手：粗壮硬朗钢梁，两端下沉带有厚重配重突起 -->
    <path fill="#E9EFEA" d="
      M 0,84
      C 25,84 55,82 82,72
      L 88,80
      C 90,92 82,104 70,105
      L 24,105
      L 0,114
      L -24,105
      L -70,105
      C -82,104 -90,92 -88,80
      L -82,72
      C -55,82 -25,84 0,84
      Z
    "/>

    <!-- 剑柄握把：坚固粗壮的单手缠皮握把（厚度达 24px） -->
    <path fill="#E9EFEA" d="
      M -12,112
      L 12,112
      L 14,145
      L 12,178
      L -12,178
      L -14,145
      Z
    "/>

    <!-- 剑首领圈环 -->
    <rect x="-16" y="176" width="32" height="7" rx="2" fill="#E9EFEA"/>

    <!-- 剑首配重球：坚实硕大的实心八角配重（厚度达 44px） -->
    <polygon fill="#E9EFEA" points="
      0,181
      18,192
      22,207
      14,222
      0,227
      -14,222
      -22,207
      -18,192
    "/>

    <!-- 剑尾铆钉顶帽 -->
    <circle cx="0" cy="231" r="5.5" fill="#E9EFEA"/>
  </g>
</svg>
