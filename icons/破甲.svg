<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <rect width="512" height="512" fill="#000000"/>
  <g transform="translate(256, 238) scale(0.88)">
    <!-- 破甲（负面效果）：完整的盾牌轮廓 + 一道粗锯齿裂缝 + 右上崩角。
         上一版裂缝贯穿整块盾，实机读成"一对翅膀/蝴蝶结"。
         裂缝**绝不能贯穿**——盾必须仍然连成一体，才读得出"破损的盾"。 -->
    <path fill="#E9EFEA" d="M -196,-208 L 196,-208 L 196,10 C 196,132 104,214 0,248 C -104,214 -196,132 -196,10 Z"/>
    <path fill="#000000" d="M 196,-208 L 196,-64 L 92,-208 Z"/>
    <path fill="#000000" d="M 22,-210 L 62,-120 L 12,-30 L 62,60 L 22,150 L -22,150 L 18,60 L -32,-30 L 18,-120 L -22,-210 Z"/>
  </g>
</svg>
