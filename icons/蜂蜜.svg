    <polygon fill="#E9EFEA" points="0,-190 -164.5,-95 -164.5,95 0,190 164.5,95 164.5,-95"/>
    <polygon fill="#000000" points="0,-46 -39.8,-23 -39.8,23 0,46 39.8,23 39.8,-23"/>
    <polygon fill="#000000" points="115,-46 75.2,-23 75.2,23 115,46 154.8,23 154.8,-23"/>
    <polygon fill="#000000" points="57.5,53.6 17.7,76.6 17.7,122.6 57.5,145.6 97.3,122.6 97.3,76.6"/>
    <polygon fill="#000000" points="-57.5,53.6 -97.3,76.6 -97.3,122.6 -57.5,145.6 -17.7,122.6 -17.7,76.6"/>
    <polygon fill="#000000" points="-115,-46 -154.8,-23 -154.8,23 -115,46 -75.2,23 -75.2,-23"/>
    <polygon fill="#000000" points="-57.5,-145.6 -97.3,-122.6 -97.3,-76.6 -57.5,-53.6 -17.7,-76.6 -17.7,-122.6"/>
    <polygon fill="#000000" points="57.5,-145.6 17.7,-122.6 17.7,-76.6 57.5,-53.6 97.3,-76.6 97.3,-122.6"/>
