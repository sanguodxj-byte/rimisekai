<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <rect width="512" height="512" fill="#000000"/>
  <g transform="translate(296, 318) rotate(-38)">
    <!-- 极度修长笔挺的三棱刺剑身（长达390px！从 Y=70 延伸到 Y=-320，宽20） -->
    <path fill="#E9EFEA" d="M 0,-320 L 10,-220 L 8,70 L -8,70 L -10,-220 Z"/>
    <rect x="-1.5" y="-240" width="3" height="300" fill="#000000"/>
    <!-- 精巧收紧的横向主护手横梁（宽180，厚14） -->
    <path fill="#E9EFEA" d="
      M -90,62 C -30,72 30,72 90,62
      L 90,74 C 30,84 -30,84 -90,74
      Z
    "/>
    <circle cx="-90" cy="68" r="6" fill="#E9EFEA"/>
    <circle cx="90" cy="68" r="6" fill="#E9EFEA"/>
    <!-- 紧凑双指护环（比例精致收缩，绝不抢剑刃的风头！） -->
    <ellipse cx="-30" cy="95" rx="26" ry="22" fill="#E9EFEA"/>
    <ellipse cx="-30" cy="95" rx="16" ry="13" fill="#000000"/>
    <ellipse cx="30" cy="95" rx="26" ry="22" fill="#E9EFEA"/>
    <ellipse cx="30" cy="95" rx="16" ry="13" fill="#000000"/>
    <!-- 短小精干的单手缠丝握柄（长60，宽18） -->
    <rect x="-9" y="74" width="18" height="60" rx="8" fill="#E9EFEA"/>
    <!-- 古典水滴配重柄首 -->
    <ellipse cx="0" cy="142" rx="14" ry="18" fill="#E9EFEA"/>
  </g>
</svg>
