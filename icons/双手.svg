<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <rect width="512" height="512" fill="#000000"/>
  <g transform="translate(256, 262) scale(0.88)">
    <!-- 双手巨剑（Zweihander）：宽阔无比的双手大剑垂直插入地面，带有标志性副突刺（Parrying lugs） -->
    <!-- 顶部修长双手柄与配重球 -->
    <circle cx="0" cy="-215" r="24" fill="#E9EFEA"/>
    <rect x="-10" y="-195" width="20" height="105" rx="3" fill="#E9EFEA"/>
    <!-- 宽阔雄壮的双手十字护手横梁（跨度达 220px） -->
    <rect x="-110" y="-95" width="220" height="25" rx="6" fill="#E9EFEA"/>
    <circle cx="-110" cy="-82" r="12" fill="#E9EFEA"/>
    <circle cx="110" cy="-82" r="12" fill="#E9EFEA"/>

    <!-- 剑身带双手剑特有的两侧防卫副翼（Parrying hooks） -->
    <path fill="#E9EFEA" d="
      M -20,-70 L 20,-70
      L 22,-20 L 50,-15 L 22,0
      L 24,140 L 0,225 L -24,140
      L -22,0 L -50,-15 L -22,-20
      Z
    "/>
    <polygon fill="#000000" points="0,-65 2,170 -2,170"/>
  </g>
</svg>
