<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <rect width="512" height="512" fill="#000000"/>
  <g transform="translate(290, 240) rotate(-35)">
    <!-- 跃起弯曲的鲜活整鱼剪影（Fish） -->
    <!-- 鱼身大弧度流线体 -->
    <path fill="#E9EFEA" d="
      M -185,0
      C -150,-95 -40,-135 70,-110
      C 135,-95 180,-30 205,0
      C 180,30 135,95 70,110
      C -40,135 -150,95 -185,0
      Z
    "/>
    <!-- 鱼尾扇形尾鳍 -->
    <polygon fill="#E9EFEA" points="
      -175,0 -235,-75 -205,0 -235,75
    "/>
    <!-- 背鳍 -->
    <path fill="#E9EFEA" d="M 20,-115 C 60,-155 110,-145 120,-95 Z"/>
    <!-- 腹鳍 -->
    <path fill="#E9EFEA" d="M 40,112 C 75,145 115,135 110,95 Z"/>
    <!-- 鱼眼（实心黑圆） -->
    <circle cx="155" cy="-25" r="10" fill="#000000"/>
    <circle cx="157" cy="-27" r="3" fill="#E9EFEA"/>
    <!-- 鱼鳃弧线缝隙（负形割槽） -->
    <path fill="#000000" d="M 120,-60 C 100,0 100,20 120,60 L 110,60 C 90,20 90,0 110,-60 Z"/>
  </g>
</svg>