<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <rect width="512" height="512" fill="#000000"/>
  <g transform="translate(256, 248)">
    <!-- 钢（材料）：三块钢锭**竖着一块压一块叠成柱**。
         上一版是「下两块并排 + 上一块压缝」，实机 40px 下两块下锭之间的缝正好成了裤裆，
         被读成「一条裤子」。现在改成上下三层直叠、每层比下层略窄，
         中间留两道粗黑缝，读出来是「三块金属锭叠成一摞」。
         块数仍是这一族的记号：铁 1、青铜 2、钢 3。 -->
    <path fill="#E9EFEA" d="M -196,62 L 196,62 L 216,200 L -216,200 Z"/>
    <path fill="#E9EFEA" d="M -170,-62 L 170,-62 L 196,62 L -196,62 Z"/>
    <path fill="#E9EFEA" d="M -144,-186 L 144,-186 L 170,-62 L -170,-62 Z"/>
    <rect x="-190" y="38" width="380" height="24" fill="#000000"/>
    <rect x="-164" y="-86" width="328" height="24" fill="#000000"/>
  </g>
</svg>
