<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <rect width="512" height="512" fill="#000000"/>
  <g transform="translate(256, 256)">
    <!-- 经典同心圆高精度瞄准十字准星（Crosshair） -->
    <!-- 外瞄准环 -->
    <circle cx="0" cy="0" r="160" fill="#E9EFEA"/>
    <circle cx="0" cy="0" r="140" fill="#000000"/>
    <!-- 内瞄准环 -->
    <circle cx="0" cy="0" r="90" fill="#E9EFEA"/>
    <circle cx="0" cy="0" r="70" fill="#000000"/>

    <!-- 四向十字瞄准标线 -->
    <rect x="-190" y="-8" width="380" height="16" fill="#E9EFEA"/>
    <rect x="-8" y="-190" width="16" height="380" fill="#E9EFEA"/>

    <!-- 正中心被准星锁定的实心箭靶红心点 -->
    <circle cx="0" cy="0" r="28" fill="#E9EFEA"/>
    <circle cx="0" cy="0" r="10" fill="#000000"/>
  </g>
</svg>