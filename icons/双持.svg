      <polygon fill="#E9EFEA" points="0,-220 25,-150 18,30 45,35 45,50 -45,50 -45,35 -18,30 -25,-150"/>
      <rect x="-8" y="50" width="16" height="75" rx="2" fill="#E9EFEA"/>
      <circle cx="0" cy="140" r="18" fill="#E9EFEA"/>
    </g>
    <g transform="rotate(45)">
      <polygon fill="#E9EFEA" points="0,-220 25,-150 18,30 45,35 45,50 -45,50 -45,35 -18,30 -25,-150"/>
      <rect x="-8" y="50" width="16" height="75" rx="2" fill="#E9EFEA"/>
      <circle cx="0" cy="140" r="18" fill="#E9EFEA"/>
    </g>
    <!-- 交叉核心光芒负形切分 -->
